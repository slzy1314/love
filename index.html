<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>栗子吖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-image: url('./image/520.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="loveWall"></canvas>
    <script>
        const canvas = document.getElementById('loveWall');
        const ctx = canvas.getContext('2d');

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();

        const isMobile = /Mobi|Android/i.test(navigator.userAgent);
        // 根据设备类型调整元素数量
        const numHearts = isMobile? 30 : 100;
        const numImages = isMobile? 2 : 7;
        const numMeteors = isMobile? 10 : 40;

        class Heart {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * (isMobile? 15 : 20) + (isMobile? 5 : 10);
                this.speed = Math.random() * (isMobile? 1 : 2) + (isMobile? 0.5 : 1);
                this.color = `rgba(255, ${Math.floor(Math.random() * 100)}, ${Math.floor(Math.random() * 100)}, ${Math.random()})`;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.bezierCurveTo(
                    this.x + this.size / 2, this.y - this.size / 2,
                    this.x + this.size, this.y + this.size / 3,
                    this.x, this.y + this.size
                );
                ctx.bezierCurveTo(
                    this.x - this.size, this.y + this.size / 3,
                    this.x - this.size / 2, this.y - this.size / 2,
                    this.x, this.y
                );
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
        }

        class ImageItem {
            constructor(image) {
                this.baseSize = Math.random() * (isMobile? 150 : 250) + (isMobile? 100 : 150);
                this.speed = Math.random() * (isMobile? 1 : 2) + (isMobile? 1 : 2);
                this.image = image;
                this.aspectRatio = image.width / image.height;
                if (this.aspectRatio >= 1) {
                    this.width = this.baseSize;
                    this.height = this.baseSize / this.aspectRatio;
                } else {
                    this.height = this.baseSize;
                    this.width = this.baseSize * this.aspectRatio;
                }
                this.setInitialPosition();
            }

            setInitialPosition() {
                let isOverlap;
                do {
                    isOverlap = false;
                    this.x = Math.random() * (canvas.width - this.width);
                    this.y = -this.height;
                    for (let i = 0; i < imageItems.length; i++) {
                        if (imageItems[i]!== this) {
                            if (
                                this.x < imageItems[i].x + imageItems[i].width &&
                                this.x + this.width > imageItems[i].x &&
                                this.y < imageItems[i].y + imageItems[i].height &&
                                this.y + this.height > imageItems[i].y
                            ) {
                                isOverlap = true;
                                break;
                            }
                        }
                    }
                } while (isOverlap);
            }

            draw() {
                ctx.drawImage(this.image, this.x, this.y, this.width, this.height);
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.setInitialPosition();
                }
                if (this.x < 0) {
                    this.x = 0;
                }
                if (this.x + this.width > canvas.width) {
                    this.x = canvas.width - this.width;
                }
            }
        }

        class Meteor {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -Math.random() * canvas.height;
                this.speedX = Math.random() * (isMobile? 3 : 5) + (isMobile? 1 : 2);
                this.speedY = Math.random() * (isMobile? 3 : 5) + (isMobile? 1 : 2);
                this.size = Math.random() * (isMobile? 2 : 3) + (isMobile? 0.5 : 1);
                this.color = `rgba(255, 255, 255, ${Math.random()})`;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y > canvas.height || this.x > canvas.width) {
                    this.x = Math.random() * canvas.width;
                    this.y = -Math.random() * canvas.height;
                }
            }
        }

        const hearts = [];
        for (let i = 0; i < numHearts; i++) {
            hearts.push(new Heart());
        }

        const images = [];
        const imageUrls = [];
        for (let i = 1; i <= numImages; i++) {
            imageUrls.push(`./image/栗子${i}.jpg`);
        }
        const imageItems = [];

        const meteors = [];
        for (let i = 0; i < numMeteors; i++) {
            meteors.push(new Meteor());
        }

        imageUrls.forEach(url => {
            const image = new Image();
            image.src = url;
            images.push(image);
        });

        Promise.all(images.map(img => new Promise(resolve => img.onload = resolve)))
          .then(() => {
                images.forEach(img => {
                    imageItems.push(new ImageItem(img));
                });

                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    hearts.forEach(heart => {
                        heart.draw();
                        heart.update();
                    });

                    imageItems.forEach(imageItem => {
                        imageItem.draw();
                        imageItem.update();
                    });

                    meteors.forEach(meteor => {
                        meteor.draw();
                        meteor.update();
                    });

                    requestAnimationFrame(animate);
                }

                animate();
            });

        window.addEventListener('resize', () => {
            setCanvasSize();
        });
    </script>
</body>

</html>
